description: >-
  CommScope is a global provider of communications-network infrastructure, including fiber-optic and copper cabling,
  antenna systems, and cloud- managed enterprise networking. Following its acquisitions of ARRIS (2019) and the Ruckus
  Wi-Fi business, CommScope's primary public developer surface is the RUCKUS One API, a JSON REST surface for managing
  Wi-Fi networks, ICX switches, access points, venues, and managed-service-provider delegation. Companion product lines
  (RUCKUS Cloud, RUCKUS IoT, ICX RESTCONF, SmartZone, Cloudpath, Unleashed Multi- Site Manager, SmartCell Insight) ship
  their own REST/RESTCONF APIs and are documented through the CommScope and RUCKUS Networks developer centers.
apis:
- aid: commscope-holding:smartzone-public-api
  name: RUCKUS SmartZone Public API
  tags:
  - Controllers
  - Networking
  - REST
  - RUCKUS
  - SmartZone
  - Wi-Fi
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.commscope.com/
  properties:
  - url: https://docs.commscope.com/
    type: Documentation
  - url: https://www.ruckusnetworks.com/developer-central/
    type: DeveloperCentral
  description: >-
    REST and OpenAPI surface for managing on-premises SmartZone controllers (SZ144, SZ300, vSZ-E, vSZ-H)
    and ICX Management. Used to integrate SmartZone with NMS, monitoring, and provisioning pipelines.
    Authentication and base URL are tenant-specific to the controller deployment.
  x-features:
  - REST API and OpenAPI documents per SmartZone release
  - WISPr and MQTT companion APIs
  - Covers vSZ-E, vSZ-H, SZ144, SZ300, ICX Management
  x-use-cases:
  - On-premises SmartZone monitoring and provisioning automation
  - NMS and observability pipelines
  - Integrating SmartZone with ITSM/ticketing systems
- aid: commscope-holding:icx-restconf-api
  name: RUCKUS ICX RESTCONF API
  tags:
  - ICX
  - Networking
  - RESTCONF
  - RUCKUS
  - Switches
  - YANG
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.ruckusnetworks.com/developer-central/
  properties:
  - url: https://www.ruckusnetworks.com/developer-central/
    type: Documentation
  description: >-
    RESTCONF API for ICX switches running FastIron 09.0.10/10.0.20 (GA). Models are YANG-based and follow
    standard RESTCONF semantics. Covers ICX 7150, 7250, 7450, 7550, 7650, 7850, 8200.
  x-features:
  - YANG/RESTCONF compliant
  - Per-device authentication
  - Covers ICX 7150 through 8200 platforms
  x-use-cases:
  - Direct programmatic switch configuration
  - Network state telemetry collection
  - Device-level automation for campus deployments
- aid: commscope-holding:ruckus-iot-api
  name: RUCKUS IoT Platform API
  tags:
  - Controllers
  - IoT
  - Networking
  - REST
  - RUCKUS
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.ruckusnetworks.com/developer-central/
  properties:
  - url: https://www.ruckusnetworks.com/developer-central/
    type: Documentation
  description: >-
    REST API (v2.2) for the RUCKUS IoT Platform Controller. Manages the IoT controller, IoT-enabled access
    points, and downstream devices and sensors.
  x-features:
  - REST surface for IoT Controller, APs, and sensors
  - Device lifecycle and policy management
  - Companion controller SDK
  x-use-cases:
  - Managing IoT-enabled APs and downstream sensors
  - Policy and rule automation across IoT estates
  - Telemetry collection from environmental and asset sensors
